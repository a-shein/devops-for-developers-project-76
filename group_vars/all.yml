pip_install_packages:
  - name: docker

# Внешний порт, на котором приложение Redmine доступно на каждом сервере
# и на который балансировщик пробрасывает трафик.
redmine_port: 8080

# Домен проекта. Реальный домен не регистрировался (см. шаг 2) — используется
# локальный алиас, резолвящийся через `curl --resolve` / `/etc/hosts`.
project_domain: project76.test
