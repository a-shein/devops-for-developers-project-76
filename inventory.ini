[webservers]
app1 ansible_host=192.168.56.11 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/app1/virtualbox/private_key
app2 ansible_host=192.168.56.12 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/app2/virtualbox/private_key

[dbservers]
db ansible_host=192.168.56.13 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/db/virtualbox/private_key

[proxy]
proxy ansible_host=192.168.56.10 ansible_user=vagrant ansible_ssh_private_key_file=.vagrant/machines/proxy/virtualbox/private_key

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3

[dbservers:vars]
ansible_python_interpreter=/usr/bin/python3

[proxy:vars]
ansible_python_interpreter=/usr/bin/python3
