# Подготовка окружения на всех серверах: ставим pip и Docker через роли Ansible Galaxy
- hosts: all
  become: true
  tags: [prepare]
  roles:
    - geerlingguy.pip
    - geerlingguy.docker

  # community.docker использует собственный встроенный API-клиент. Слишком новые
  # requests/urllib3 ломают его транспорт для unix-сокета ("http+docker"),
  # поэтому фиксируем совместимые версии.
  tasks:
    - name: Pin requests/urllib3 to versions compatible with community.docker
      pip:
        name:
          - "requests==2.31.0"
          - "urllib3<2"
        executable: pip3

# Деплой базы данных PostgreSQL в Docker-контейнере
- hosts: dbservers
  become: true
  vars:
    db_name: hexlet
    db_user: hexlet
    db_password: "{{ lookup('env', 'HEXLET_DB_PASSWORD') | default('hexlet_local_pass', true) }}"
  tasks:
    - name: Run postgres container
      community.docker.docker_container:
        name: postgres
        image: "postgres:16"
        restart_policy: always
        state: started
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: "{{ db_name }}"
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_password }}"
        volumes:
          - "pgdata:/var/lib/postgresql/data"

# Деплой приложения (Redmine) на веб-серверы
- hosts: webservers
  become: true
  vars:
    db_host: "{{ hostvars[groups['dbservers'][0]]['ansible_host'] }}"
    db_name: hexlet
    db_user: hexlet
    db_password: "{{ lookup('env', 'HEXLET_DB_PASSWORD') | default('hexlet_local_pass', true) }}"
  tasks:
    - name: Create environment variables from template
      template:
        src: templates/redmine.env.j2
        dest: /etc/redmine.env
        mode: "0600"

    - name: Run container
      community.docker.docker_container:
        name: redmine
        image: "redmine:5"
        restart_policy: always
        state: started
        ports:
          - "0.0.0.0:80:3000"
        env_file: /etc/redmine.env

# Деплой реверс-прокси / балансировщика нагрузки
- hosts: proxy
  become: true
  vars:
    app_backends: "{{ groups['webservers'] | map('extract', hostvars, 'ansible_host') | list }}"
  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Configure load balancer
      template:
        src: templates/nginx-lb.conf.j2
        dest: /etc/nginx/sites-available/default
        mode: "0644"
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
