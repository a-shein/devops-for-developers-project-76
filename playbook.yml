# Подготовка окружения на всех серверах: ставим pip и Docker через роли Ansible Galaxy.
# Выполняется только `make prepare`, команда деплоя (--tags deploy) её не трогает.
- hosts: all
  become: true
  tags: [prepare]
  pre_tasks:
    # Образы с заранее собранным (кешированным) apt-индексом могут успеть
    # устареть к моменту запуска ролей — обновляем явно перед установкой.
    - name: Refresh apt cache before installing role dependencies
      apt:
        update_cache: yes
        cache_valid_time: 0
      when: ansible_facts.os_family == "Debian"
  roles:
    - geerlingguy.pip
    - geerlingguy.docker

  # community.docker использует собственный встроенный API-клиент. Слишком новые
  # requests/urllib3 ломают его транспорт для unix-сокета ("http+docker"),
  # поэтому фиксируем совместимые версии.
  tasks:
    - name: Pin requests/urllib3 to versions compatible with community.docker
      pip:
        name:
          - "requests==2.31.0"
          - "urllib3<2"
        executable: pip3

# Деплой базы данных PostgreSQL в Docker-контейнере
- hosts: dbservers
  become: true
  tags: [deploy]
  vars:
    db_name: hexlet
    db_user: hexlet
    # Пароль берём из зашифрованной переменной group_vars/webservers/vault.yml —
    # сервер БД сам не входит в группу webservers, поэтому читаем его через hostvars.
    db_password: "{{ hostvars[groups['webservers'][0]]['db_password'] }}"
  tasks:
    - name: Run postgres container
      community.docker.docker_container:
        name: postgres
        image: "postgres:16"
        restart_policy: always
        state: started
        ports:
          - "5432:5432"
        env:
          POSTGRES_DB: "{{ db_name }}"
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_password }}"
        volumes:
          - "pgdata:/var/lib/postgresql/data"

# Деплой приложения (Redmine) на веб-серверы.
# Только запуск контейнера — настройки сервера (Docker/pip) здесь не меняются.
- hosts: webservers
  become: true
  tags: [deploy]
  vars:
    db_host: "{{ hostvars[groups['dbservers'][0]]['ansible_host'] }}"
    db_name: hexlet
    db_user: hexlet
    # db_password, datadog_api_key, datadog_checks приходят из group_vars/webservers/
    # (vars.yml ссылается на зашифрованные значения из vault.yml)
  roles:
    - datadog.datadog
  tasks:
    - name: Create environment variables from template
      template:
        src: templates/redmine.env.j2
        dest: /etc/redmine.env
        mode: "0600"

    - name: Run container
      community.docker.docker_container:
        name: redmine
        image: "redmine:5"
        restart_policy: always
        state: started
        ports:
          - "0.0.0.0:{{ redmine_port }}:3000"
        env_file: /etc/redmine.env

# Деплой реверс-прокси / балансировщика нагрузки:
# проброс redmine_port (http) и 443 (https, самоподписанный сертификат) на app1/app2.
- hosts: proxy
  become: true
  tags: [deploy]
  vars:
    app_backends: "{{ groups['webservers'] | map('extract', hostvars, 'ansible_host') | list }}"
  tasks:
    - name: Install nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure TLS directory exists
      file:
        path: /etc/nginx/ssl
        state: directory
        mode: "0755"

    - name: Generate self-signed TLS certificate for the project domain
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/nginx/ssl/{{ project_domain }}.key
        -out /etc/nginx/ssl/{{ project_domain }}.crt
        -subj "/CN={{ project_domain }}"
      args:
        creates: /etc/nginx/ssl/{{ project_domain }}.crt

    - name: Configure load balancer
      template:
        src: templates/nginx-lb.conf.j2
        dest: /etc/nginx/sites-available/default
        mode: "0644"
      notify: Reload nginx

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
